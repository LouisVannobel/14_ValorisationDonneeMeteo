name: CI/CD Pipeline

"on":
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  install-dependencies:
    name: Install dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

  run-tests:
    name: Run tests
    runs-on: ubuntu-24.04
    needs: install-dependencies

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meteodb
          POSTGRES_USER: infoclimat
          POSTGRES_PASSWORD: infoclimat2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infoclimat -d meteodb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Create reports directory
        run: mkdir -p reports

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: meteodb
          DB_USER: infoclimat
          DB_PASSWORD: infoclimat2026
        run: uv run pytest --junitxml=../reports/backend-pytest.xml

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:ci -- --reporter=default --reporter=junit --outputFile=../reports/frontend-vitest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/*.xml

  run-linter:
    name: Run linter
    runs-on: ubuntu-24.04
    needs: install-dependencies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check config weather manage.py --exclude weather/tests

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  run-security-scan:
    name: Run security scan
    runs-on: ubuntu-24.04
    needs: install-dependencies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload scan report artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-code-report
          path: trivy-results.sarif

  build-docker-image:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs:
      - run-tests
      - run-linter
      - run-security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Compute lowercase image owner
        id: image-vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push backend image
        uses: docker/build-push-action@v7.0.0
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.image-vars.outputs.owner_lc }}/meteo-backend:${{ github.sha }}
            ghcr.io/${{ steps.image-vars.outputs.owner_lc }}/meteo-backend:latest

      - name: Build and optionally push frontend image
        uses: docker/build-push-action@v7.0.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.image-vars.outputs.owner_lc }}/meteo-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image-vars.outputs.owner_lc }}/meteo-frontend:latest
